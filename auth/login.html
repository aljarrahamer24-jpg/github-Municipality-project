<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b5d51">
  <meta name="description" content="منصة إدارة شكاوى وطلبات خدمات البلدية">
  <title>تسجيل الدخول | منصة شكاوى البلدية</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-layout="auth" data-active="" data-root="../">
  <main id="content">
    <h1>تسجيل الدخول</h1>
    <p class="lead">مرحباً بعودتك، سجّل دخولك لمتابعة بلاغاتك.</p>

    <div id="form-alert" class="mt-6" hidden></div>

    <form id="login-form" class="stack mt-6" novalidate>
      <div class="field">
        <label class="label" for="email">البريد الإلكتروني</label>
        <div class="input-wrap"><i data-icon="mail"></i><input class="input" id="email" type="email" autocomplete="email" placeholder="name@example.com" dir="ltr" required></div>
        <p class="error-text">أدخل بريداً إلكترونياً صحيحاً</p>
      </div>
      <div class="field">
        <label class="label" for="password">كلمة المرور</label>
        <div class="input-wrap"><i data-icon="lock"></i><input class="input" id="password" type="password" autocomplete="current-password" placeholder="••••••••" required></div>
        <p class="error-text">أدخل كلمة المرور</p>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-xs c-3">يتم توجيهك تلقائياً حسب صلاحياتك</span>
        <a class="link" href="forgot-password.html">نسيت كلمة المرور؟</a>
      </div>
      <button class="btn btn-primary btn-lg btn-block" type="submit">تسجيل الدخول</button>
    </form>
    <p class="text-center text-sm c-2 mt-6">ليس لديك حساب؟ <a class="link fw-600" href="register.html">إنشاء حساب جديد</a></p>
  </main>

  <script src="../assets/vendor/supabase/supabase.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/core/icons.js"></script>
  <script src="../assets/js/core/utils.js"></script>
  <script src="../assets/js/core/supabase.js"></script>
  <script src="../assets/js/core/ui.js"></script>
  <script src="../assets/js/core/api.js"></script>
  <script src="../assets/js/core/notifications.js"></script>
  <script src="../assets/js/core/layout.js"></script>
  <script src="../assets/js/core/app.js"></script>
  <script src="../assets/js/auth/login.js"></script>
</body>
</html>

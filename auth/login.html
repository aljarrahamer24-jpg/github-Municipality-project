<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b5d51">
  <meta name="description" content="منصة إدارة شكاوى وطلبات خدمات البلدية">
  <title>تسجيل الدخول | منصة شكاوى البلدية</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-layout="auth" data-active="" data-root="../">
  <main id="content">
    <h1>تسجيل الدخول</h1>
    <p class="lead">مرحباً بعودتك، سجّل دخولك لمتابعة بلاغاتك.</p>

    <!-- اختيار الدور: للعرض التجريبي فقط (مرحلة التصميم) -->
    <div class="demo-roles">
      <p>دخول تجريبي (مرحلة التصميم)</p>
      <div class="role-grid">
        <button type="button" class="role-opt active" data-role="citizen"><i data-icon="user"></i>مواطن</button>
        <button type="button" class="role-opt" data-role="employee"><i data-icon="briefcase"></i>موظف</button>
        <button type="button" class="role-opt" data-role="admin"><i data-icon="shield-check"></i>مدير</button>
      </div>
    </div>

    <form id="login-form" class="stack mt-6">
      <div class="field">
        <label class="label" for="email">البريد الإلكتروني أو رقم الهاتف</label>
        <div class="input-wrap"><i data-icon="mail"></i><input class="input" id="email" value="abdullah@example.com" placeholder="name@example.com"></div>
      </div>
      <div class="field">
        <label class="label" for="password">كلمة المرور</label>
        <div class="input-wrap"><i data-icon="lock"></i><input class="input" id="password" type="password" value="password123"></div>
      </div>
      <div class="flex items-center justify-between">
        <label class="check"><input type="checkbox" checked> تذكرني</label>
        <a class="link" href="forgot-password.html">نسيت كلمة المرور؟</a>
      </div>
      <button class="btn btn-primary btn-lg btn-block" type="submit">تسجيل الدخول</button>
    </form>
    <p class="text-center text-sm c-2 mt-6">ليس لديك حساب؟ <a class="link fw-600" href="register.html">إنشاء حساب جديد</a></p>
  </main>

  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/pages/auth.js"></script>
</body>
</html>

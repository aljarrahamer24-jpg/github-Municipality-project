<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b5d51">
  <meta name="description" content="منصة إدارة شكاوى وطلبات خدمات البلدية">
  <title>إعادة تعيين كلمة المرور | منصة شكاوى البلدية</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-layout="auth" data-active="" data-root="../">
  <main id="content">
    <div id="reset-step">
      <h1>إعادة تعيين كلمة المرور</h1>
      <p class="lead">اختر كلمة مرور قوية لم تستخدمها من قبل.</p>
      <form id="reset-form" class="stack mt-6">
        <div class="field">
          <label class="label" for="new-password">كلمة المرور الجديدة</label>
          <div class="input-wrap"><i data-icon="lock"></i><input class="input" id="new-password" type="password" placeholder="••••••••"></div>
        </div>
        <div class="stack-sm">
          <div class="strength" id="strength"></div>
          <ul class="rules grid sm-cols-2" id="rules"></ul>
        </div>
        <div class="field">
          <label class="label">تأكيد كلمة المرور</label>
          <div class="input-wrap"><i data-icon="lock"></i><input class="input" type="password" placeholder="••••••••"></div>
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit">حفظ كلمة المرور</button>
      </form>
    </div>

    <div id="reset-done" class="text-center" hidden>
      <span class="result-icon box-success icon-box"><i data-icon="shield-check"></i></span>
      <h1 class="mt-4">تم تغيير كلمة المرور</h1>
      <p class="lead">يمكنك الآن تسجيل الدخول بكلمة المرور الجديدة.</p>
      <a class="btn btn-primary btn-block mt-6" href="login.html">تسجيل الدخول</a>
    </div>
  </main>

  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/pages/auth.js"></script>
</body>
</html>

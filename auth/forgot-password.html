<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b5d51">
  <meta name="description" content="منصة إدارة شكاوى وطلبات خدمات البلدية">
  <title>نسيت كلمة المرور | منصة شكاوى البلدية</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-layout="auth" data-active="" data-root="../">
  <main id="content">
    <div id="forgot-step">
      <span class="icon-box"><i data-icon="key-round"></i></span>
      <h1 class="mt-4">نسيت كلمة المرور؟</h1>
      <p class="lead">أدخل بريدك الإلكتروني المسجل وسنرسل لك رابطاً لإعادة تعيين كلمة المرور.</p>
      <form id="forgot-form" class="stack mt-6">
        <div class="field">
          <label class="label">البريد الإلكتروني</label>
          <div class="input-wrap"><i data-icon="mail"></i><input class="input" type="email" placeholder="name@example.com" required></div>
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit">إرسال رابط إعادة التعيين</button>
      </form>
      <a class="flex items-center gap-1 text-sm fw-500 c-2 mt-6" href="login.html"><i data-icon="arrow-right"></i> العودة لتسجيل الدخول</a>
    </div>

    <div id="forgot-sent" class="text-center" hidden>
      <span class="result-icon box-success icon-box"><i data-icon="mail-check"></i></span>
      <h1 class="mt-4">تحقق من بريدك الإلكتروني</h1>
      <p class="lead leading-loose">أرسلنا رابط إعادة تعيين كلمة المرور إلى بريدك. الرابط صالح لمدة 30 دقيقة.</p>
      <div class="grid mt-6" style="gap:8px">
        <a class="btn btn-primary btn-block" href="reset-password.html">فتح رابط إعادة التعيين (تجريبي)</a>
        <button class="btn btn-ghost btn-block" id="resend" type="button">لم يصلك البريد؟ إعادة الإرسال</button>
      </div>
    </div>
  </main>

  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/pages/auth.js"></script>
</body>
</html>
